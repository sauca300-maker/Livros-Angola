
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Angolana</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('https://images.unsplash.com/photo-1512820790803-83ca734da794'); /* fundo de livros */
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 320px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    h2 {
      color: #002244; /* azul escuro */
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #3399ff; /* azul claro */
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #002244;
    }

    .google-btn {
      background-color: #dd4b39;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Biblioteca Angolana</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Senha" />
    <button onclick="login()">Entrar</button>
    <button class="google-btn" onclick="loginComGoogle()">Continuar com Google</button>
  </div>

  <script>
    // Configuração Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCVIhK2lTuH0cT77A72h61D3XU0dIATcOA",
      authDomain: "zeca-58cd9.firebaseapp.com",
      projectId: "zeca-58cd9",
      storageBucket: "zeca-58cd9.appspot.com",
      messagingSenderId: "174758634885",
      appId: "1:174758634885:web:suaAppId"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
  function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          window.location.href = "projeto.html"; // redirecionar
        })
        .catch((error) => {
          alert("A palavra passe ou e-mail está errada");
        });
    }

    function loginComGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then((result) => {
          window.location.href = "projeto.html";
        })
        .catch((error) => {
          alert("A palavra passe ou e-mail está errada");
        });
    }
  </script>
</body>
</html>
